# Example overlay: mount @lonk1989/webclaw into a DSH profile.
#
# In the DeepSeek Harness workspace:
#   pnpm add @lonk1989/webclaw
#   # or: pnpm add E:/Workspace/webclaw-oss/packages/webclaw
#   pnpm dsh web --patch path/to/this/file
#
# Defaults: ensureOnBoot downloads webclaw-lite from GitHub Releases (Windows).

- insert:
    - id: webclaw
      name: '@lonk1989/webclaw'
      config:
        registerSkill: true
        recipesRel: recipes
        # ensureOnBoot: true   # default
        # binaryPath: 'C:/path/to/webclaw-lite.exe'  # skip auto-download
        # liteBaseUrl: 'https://cdn.example.com/webclaw/v0.1.8'  # tried before GitHub/mirrors
