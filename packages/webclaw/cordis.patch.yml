# Example overlay: mount @lonk1989/webclaw into a DSH profile.
#
# In the DeepSeek Harness workspace:
#   pnpm add @lonk1989/webclaw
#   # or: pnpm add E:/Workspace/webclaw-oss/packages/webclaw
#   pnpm dsh web --patch path/to/this/file
#
# Defaults: ensureOnBoot downloads webclaw-lite from GitHub Releases
# (Windows x64 + macOS arm64).
#
# systems: optional deploy overlay — seeds local vault entries (id/name/url only,
# no passwords) via `accounts ensure` on boot. Put REAL corp login URLs in your
# private DSH fork patch, not in this public example.

- insert:
    - id: webclaw
      name: '@lonk1989/webclaw'
      config:
        registerSkill: true
        recipesRel: recipes
        # ensureOnBoot: true   # default
        # binaryPath: 'C:/path/to/webclaw-lite.exe'  # or macOS path; skips auto-download
        # liteBaseUrl: 'https://cdn.example.com/webclaw/v0.1.8'  # tried before GitHub/mirrors
        # systems:  # private deploy only — use real SSO URL when available (no password)
        #   - id: ehr
        #     name: EHR系统
        #     url: https://example.com/login?sso=lark&next=%2F%23%23%2Findex
        #   - id: old-mes
        #     name: 旧MES系统
        #     url: https://example.com/mes-login
