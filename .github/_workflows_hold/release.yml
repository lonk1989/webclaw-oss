name: release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release-lite:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Build webclaw-lite
        run: cargo build --release --bin webclaw-lite --manifest-path runtime/Cargo.toml
      - name: Hash
        shell: pwsh
        run: |
          $exe = "target/release/webclaw-lite.exe"
          Copy-Item $exe "webclaw-lite-windows-x64.exe"
          Get-FileHash "webclaw-lite-windows-x64.exe" -Algorithm SHA256 |
            ForEach-Object { $_.Hash.ToLower() + "  webclaw-lite-windows-x64.exe" } |
            Set-Content "webclaw-lite-windows-x64.exe.sha256" -NoNewline
      - name: Upload GitHub Release assets
        uses: softprops/action-gh-release@v2
        with:
          files: |
            webclaw-lite-windows-x64.exe
            webclaw-lite-windows-x64.exe.sha256
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  publish-npm:
    runs-on: ubuntu-latest
    needs: release-lite
    if: startsWith(github.ref, 'refs/tags/v')
    defaults:
      run:
        working-directory: packages/webclaw
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          registry-url: 'https://registry.npmjs.org'
      - run: npm install
      - run: npm run build
      - name: Publish to npm
        run: npm publish --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
