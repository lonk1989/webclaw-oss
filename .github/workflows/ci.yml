name: ci

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:

jobs:
  rust-lite:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            artifact: webclaw-lite-windows-x64
            binary: target/release/webclaw-lite.exe
          - os: macos-latest
            artifact: webclaw-lite-macos-arm64
            binary: target/release/webclaw-lite
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Build webclaw-lite
        run: cargo build --release --bin webclaw-lite --manifest-path runtime/Cargo.toml
      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: ${{ matrix.binary }}

  webclaw-plugin:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: packages/webclaw
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          registry-url: 'https://registry.npmjs.org'
      - run: npm install
      - run: npm run build
