name: release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release-lite:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            asset: webclaw-lite-windows-x64.exe
            binary: target/release/webclaw-lite.exe
          - os: macos-latest
            asset: webclaw-lite-macos-arm64
            binary: target/release/webclaw-lite
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Build webclaw-lite
        run: cargo build --release --bin webclaw-lite --manifest-path runtime/Cargo.toml
      - name: Stage asset + SHA256 (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          Copy-Item "${{ matrix.binary }}" "${{ matrix.asset }}"
          Get-FileHash "${{ matrix.asset }}" -Algorithm SHA256 |
            ForEach-Object { $_.Hash.ToLower() + "  ${{ matrix.asset }}" } |
            Set-Content "${{ matrix.asset }}.sha256" -NoNewline
      - name: Stage asset + SHA256 (macOS)
        if: runner.os == 'macOS'
        run: |
          cp "${{ matrix.binary }}" "${{ matrix.asset }}"
          shasum -a 256 "${{ matrix.asset }}" | awk '{print tolower($1) "  ${{ matrix.asset }}"}' > "${{ matrix.asset }}.sha256"
          # strip trailing newline variance: keep single line without extra blank
          tr -d '\n' < "${{ matrix.asset }}.sha256" > "${{ matrix.asset }}.sha256.tmp"
          mv "${{ matrix.asset }}.sha256.tmp" "${{ matrix.asset }}.sha256"
      - name: Upload GitHub Release assets
        uses: softprops/action-gh-release@v2
        with:
          files: |
            ${{ matrix.asset }}
            ${{ matrix.asset }}.sha256
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  publish-npm:
    runs-on: ubuntu-latest
    needs: release-lite
    if: startsWith(github.ref, 'refs/tags/v')
    permissions:
      contents: read
      id-token: write # required for npm Trusted Publishing (OIDC)
    defaults:
      run:
        working-directory: packages/webclaw
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          # Trusted Publishing needs npm >= 11.5.1; Node 24 ships a recent enough npm.
          node-version: '24'
          registry-url: 'https://registry.npmjs.org'
      - run: npm install
      - run: npm run build
      - name: Publish to npm (OIDC)
        # No NODE_AUTH_TOKEN / LONK secret — npm uses GitHub OIDC after Trusted Publisher is configured.
        run: npm publish --access public
